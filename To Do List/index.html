
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>My To-Do List 📝</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <form class="input-area" id="todo-form">
            <input
                type="text"
                id="todo-input"
                placeholder="Add a new task..."
                autocomplete="off"
            >
            <button type="submit" class="add-btn">Add</button>
        </form>

        <div class="filters">
            <button type="button" class="filter-btn active" data-filter="all">
                All
            </button>
            <button type="button" class="filter-btn" data-filter="pending">
                Pending
            </button>
            <button type="button" class="filter-btn" data-filter="completed">
                Completed
            </button>
        </div>

        <ul class="todo-list" id="todo-list"></ul>

        <div class="footer">
            <span id="counter">0 tasks left</span>
            <button type="button" id="clear-btn">Clear completed</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
